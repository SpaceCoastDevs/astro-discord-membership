name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir playground install --frozen-lockfile
      - run: pnpm --dir playground check
      - run: pnpm --dir playground exec playwright install --with-deps chromium
      - run: pnpm --dir playground test:e2e
      - run: npm pack --dry-run
