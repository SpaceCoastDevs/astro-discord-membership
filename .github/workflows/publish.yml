name: Publish package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir playground install --frozen-lockfile
      - run: pnpm --dir playground check
      - run: pnpm --dir playground exec playwright install --with-deps chromium
      - run: pnpm --dir playground test:e2e
      - name: Verify release tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "${{ github.event.release.tag_name }}"
      - run: npm pack --dry-run
      - name: Publish prerelease to npm
        if: github.event.release.prerelease
        run: |
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            npm dist-tag add "${package_name}@${package_version}" next
          else
            npm publish --tag next
          fi
          if [ "$(npm view "${package_name}" dist-tags.latest --registry=https://registry.npmjs.org/ 2>/dev/null || true)" = "${package_version}" ]; then
            npm dist-tag rm "${package_name}" latest
          fi
      - name: Publish stable release to npm
        if: ${{ !github.event.release.prerelease }}
        run: npm publish --tag latest
